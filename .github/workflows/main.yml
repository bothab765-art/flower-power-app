name: Build Flower Power APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          rm -rf flower_power_android
          unzip -o flower_power_android_project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: flower_power_android
        run: gradle assembleDebug

      - name: Upload Flower Power APK
        uses: actions/upload-artifact@v4
        with:
          name: Flower-Power-APK
          path: flower_power_android/app/build/outputs/apk/debug/app-debug.apk
