name: Build Flower Power APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          rm -rf flower_power_android
          unzip -o flower_power_android_project.zip

      - name: Fix Android activity
        run: |
          cat > flower_power_android/app/src/main/java/za/co/flowerpower/plett/MainActivity.java <<'JAVA'
          package za.co.flowerpower.plett;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();

                          if (scheme != null &&
                              (scheme.equals("http") || scheme.equals("https"))) {

                              if (uri.getHost() != null &&
                                  uri.getHost().contains("wa.me")) {
                                  try {
                                      startActivity(
                                          new Intent(Intent.ACTION_VIEW, uri)
                                      );
                                  } catch (Exception e) {
                                      Toast.makeText(
                                          MainActivity.this,
                                          "WhatsApp could not be opened",
                                          Toast.LENGTH_SHORT
                                      ).show();
                                  }
                                  return true;
                              }

                              return false;
                          }

                          try {
                              startActivity(
                                  new Intent(Intent.ACTION_VIEW, uri)
                              );
                              return true;
                          } catch (Exception e) {
                              return false;
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                              startActivityForResult(
                                  intent,
                                  FILE_CHOOSER_REQUEST
                              );
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              Toast.makeText(
                                  MainActivity.this,
                                  "Unable to open camera or files",
                                  Toast.LENGTH_SHORT
                              ).show();
                              return false;
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode != FILE_CHOOSER_REQUEST ||
                      fileCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == RESULT_OK && data != null) {

                      if (data.getClipData() != null) {

                          int count =
                              data.getClipData().getItemCount();

                          results = new Uri[count];

                          for (int i = 0; i < count; i++) {
                              results[i] =
                                  data.getClipData()
                                      .getItemAt(i)
                                      .getUri();
                          }

                      } else if (data.getData() != null) {

                          results =
                              new Uri[]{data.getData()};
                      }
                  }

                  fileCallback.onReceiveValue(results);
                  fileCallback = null;
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: flower_power_android
        run: gradle assembleDebug

      - name: Upload Flower Power APK
        uses: actions/upload-artifact@v4
        with:
          name: Flower-Power-APK
          path: flower_power_android/app/build/outputs/apk/debug/app-debug.apk
