plugins { id 'com.android.application' }

android {
    namespace 'za.co.flowerpower.plett'
    compileSdk 36

    defaultConfig {
        applicationId 'za.co.flowerpower.plett'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
